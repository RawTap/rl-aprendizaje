[project]
name = "rl-aprendizaje"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cesar Cibrian", email = "cibriancesa.ai@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "seaborn>=0.13.2",
]

[project.scripts]
rl-aprendizaje = "rl_aprendizaje:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "data-science-types>=0.2.23",
    "pandas-stubs>=3.0.5.260914",
    "types-seaborn>=0.13.2.20261006",
]
